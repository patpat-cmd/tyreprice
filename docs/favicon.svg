<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tyre -->
  <circle cx="32" cy="32" r="30" fill="#1f2328"/>
  <!-- tread blocks -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#3d444d" stroke-width="5" stroke-dasharray="5 3.64"/>
  <!-- sidewall line -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#3d444d" stroke-width="1.5"/>
  <!-- rim -->
  <circle cx="32" cy="32" r="18" fill="#e9ecef"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#adb5bd" stroke-width="2"/>
  <!-- dollar sign -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#1a7f37">$</text>
</svg>
