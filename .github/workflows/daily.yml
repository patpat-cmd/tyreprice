name: Daily tyre prices

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 7am Sydney (summer) / 6am (winter)
  workflow_dispatch:        # "Run workflow" button / "Check prices now" on the chart page
    inputs:
      test_email:
        description: "Only send a test alert email (no price check)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Set from the chart page's "Alert settings" panel (private repo variable); old secret is the fallback.
      ALERT_TO: ${{ vars.ALERT_TO || secrets.ALERT_TO }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python -m tracker.run --test-email

      - name: Check prices, save history, send alerts
        if: ${{ !inputs.test_email }}
        run: python -m tracker.run

      - name: Commit updated price history
        if: ${{ !inputs.test_email }}
        run: |
          git config user.name "tyre-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Australia/Sydney date +%F)"
          git pull --rebase   # alert settings may have been saved from the web page during the run
          git push
