# Tyre price tracker configuration.
# Edit this file on GitHub (pencil icon) to add/remove tyres or change alert rules.
# The alert email address is NOT stored here (the repo is public) - it's the ALERT_TO secret.

alerts:
  # Price alert emails. false = never email about prices (emails about a broken retailer still go out).
  enabled: false
  # Alert when today's best price is this % below the average best price of the last N days.
  percent_below_average: 10
  average_window_days: 30
  # Alert when today's best price is the lowest ever seen.
  all_time_low: true
  # Don't fire average/all-time-low alerts until we have this many days of history
  # (stops a flood of "new low!" emails in the first week).
  min_history_days: 7

# Each tyre: brand + model "match" keywords. Matching ignores case, spaces and punctuation,
# so "pilotsport4s" matches "PILOT SPORT 4 S" and "Pilot Sport 4S".
# A product matches if its brand matches AND any one of the "match" strings appears in its name.
# Run-flat tyres are always skipped. Add extra words to skip with  exclude: [word, ...]
# Optional per tyre:  target_price: 300   -> always alert when the best price is at or below this.
# Optional per tyre:  search: "words"   -> what to type into Bob Jane's search (default: the tyre name).

sizes:
  - id: sport
    label: "225/40R18 sporty"
    width: 225
    profile: 40
    rim: 18
    tyres:
      - id: conti-sc7
        name: Continental SportContact 7
        brand: continental
        match: [sportcontact7]
        search: "SportContact 7"
      - id: pirelli-pz5
        name: Pirelli P Zero (PZ5)
        brand: pirelli
        match: [pzeropz5, pz5]
        search: "P Zero PZ5"
      - id: bridgestone-potenza-sport-evo
        name: Bridgestone Potenza Sport EVO
        brand: bridgestone
        match: [potenzasportevo]
        search: "Potenza Sport EVO"
      - id: michelin-ps4s
        name: Michelin Pilot Sport 4S
        brand: michelin
        match: [pilotsport4s]
        search: "Pilot Sport 4S"
      - id: yokohama-ad09
        name: Yokohama ADVAN Neova AD09
        brand: yokohama
        match: [ad09]
        search: "Neova AD09"

  - id: ev
    label: "235/45R18 EV"
    width: 235
    profile: 45
    rim: 18
    tyres:   # touring tyres for the EV
      - id: hankook-ion-evo
        name: Hankook iON evo
        brand: hankook
        match: [ionevo]
        search: "Hankook iON evo"
      - id: michelin-primacy5-energy
        name: Michelin Primacy 5 Energy (EV)
        brand: michelin
        match: [primacy5energy]   # the EV variant only, not the regular Primacy 5
        search: "Primacy 5 Energy"
      - id: goodyear-efficientgrip-perf2
        name: Goodyear EfficientGrip Performance 2
        brand: goodyear
        match: [efficientgripperformance2]   # not the older gen 1 "EfficientGrip Performance"
        search: "EfficientGrip Performance 2"
      - id: bridgestone-turanza-t005-ev
        name: Bridgestone Turanza T005 EV
        brand: bridgestone
        match: [turanzat005ev]   # stops before "EVO", so T005 EVO / T005A don't match
        search: "Turanza T005 EV"
      - id: pirelli-cinturato-p7c2
        name: Pirelli Cinturato P7C2
        brand: pirelli
        match: [p7c2]   # older Cinturato P7 is listed as plain "P7" / "P7 CINT"
        search: "Cinturato P7 C2"
      - id: yokohama-ae51
        name: Yokohama BluEarth-GT AE51
        brand: yokohama
        match: [ae51]
        search: "BluEarth-GT AE51"
